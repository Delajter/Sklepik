<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MyShop</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <span class="title">MyShop - Kacper Bieniek</span>

        <a th:href="@{/cart}" class="cart-ico">
            <div>
                <span>Koszyk</span>
                <span th:text="'(' + ${cartTotalQty} + ')'">(0)</span>
                <span th:text="${cartTotalPrice}">0</span>
                <span>zł</span>
            </div>
        </a>
    </header>

    <div class="main-content">
        <div th:if="${infoMsg}" class="infoMsg" th:text="${infoMsg}" style="margin-bottom: 20px;"></div>

        <div style="width: 100%; display: flex; flex-direction: column; align-items: center;" th:if="${not #lists.isEmpty(cart.items)}">
            <table cellspacing="0" style="border: 0px">
                <tr th:each="cartItem, iter : ${cart.items}">
                    <td th:text="${iter.count}">1</td>
                    <td>
                        <img th:src="${cartItem.item.imgURL}">
                    </td>
                    <td th:text="${cartItem.item.name}">Ołówek</td>
                    <td style="display: flex; padding-top: 10px">
                        <p th:text="${cartItem.quantity}">1</p>
                    </td>
                    <td><span th:text="${cartItem.getSum()}">2</span> zł</td>
                </tr>
            </table>

            <div class="summary">
                <p><span>Do zapłaty </span><span th:text="${cart.getTotalPrice()}">10</span> zł</p>
            </div>

            <div class="summary" style="width: 80%; margin-top: 20px;">
                <form th:action="@{/order}" method="post">
                    <label>Imię</label>
                    <input type="text" name="firstName" required>
                    <label>Nazwisko</label>
                    <input type="text" name="lastName" required>
                    <label>Address</label>
                    <input type="text" name="address" required>
                    <label>kod pocztowy</label>
                    <input type="text" name="postCode" required>
                    <label>Miasto</label>
                    <input type="text" name="city" required>
                    <button type="submit" class="add-btn">Zamów</button>
                </form>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(cart.items) && infoMsg == null}" style="text-align: center; margin: 20px; width: 100%;">
            <h2>Twój koszyk jest pusty.</h2>
            <a th:href="@{/}" class="add-btn" style="display: inline-block; width: auto; padding: 10px 20px;">Wróć do sklepu</a>
        </div>
    </div>
</body>
</html>
