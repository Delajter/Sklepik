<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<header th:fragment="ShopHeader">
    <span class="title">MyShop - Kacper Bieniek</span>

    <a th:href="@{/cart}" class="cart-ico">
        <div>
            <span>Koszyk</span>
            <span th:text="'(' + ${cartTotalQty} + ')'">(0)</span>
            <span th:text="${cartTotalPrice}">0</span>
            <span>zł</span>
        </div>
    </a>
</header>
</body>
</html>
