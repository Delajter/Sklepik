<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<header th:fragment="ShopHeader">
    <span class="title">MyShop - Kacper Bieniek</span>

    <!-- Dynamiczny link do koszyka -->
    <a th:href="@{/order/cart}" class="cart-ico cart-icon">
        <span>Koszyk (</span>
        <span th:text="${cart.counter}">0</span>
        <span>) </span>
        <span th:text="${cart.sum}">0.00</span>
        <span> zł</span>
    </a>
</header>
</body>
</html>
